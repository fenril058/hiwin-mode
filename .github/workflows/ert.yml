name: Emacs Lisp tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['27.2', '29.4', '30.2']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Run ERT
        run: emacs -Q --batch -L . -l test/hiwin-test.el -f ert-run-tests-batch-and-exit
